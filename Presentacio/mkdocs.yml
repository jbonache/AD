site_name: Entons de desenvolupament

# Recorda que tens el extres.md, amb coses sobre Gradle, Tractament d'excepcions, paquets, etc.

nav:
  - "Inici": "index.md"
  - "Docència": "0.Docencia.md"
  - "1. Objectius": "1.Objectius.md"
  - "2. Resultats d'aprenentatge i criteris d'avaluació": "2.RAs.md"
  - "3. Continguts": "3.Continguts.md"
  - "4. Metodologia": "4.Metodologia.md"
  - "5. Avaluació": "5.Avaluacio.md"
  
theme:
  name: 'material'
  language: ca
  logo: 'img/logo.svg'
  favicon: 'img/logo.svg'
  features:
    - content.code.copy # PEr copiar codi
  palette:
    accent: deep purple
    primary: amber


extra_css:
  - css/material-just.css

plugins:
  - search
  - glightbox   # Per vore les imatges en gran quan fas clic en elles.
  # - pandoc

markdown_extensions:
  - attr_list           # Permet incorporar atributs a les imatges { width=100px }
  - md_in_html # Junt a attr_list per afegir peus a les imatges
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      baselevel: 2
      toc_depth: 3
